apiVersion: v1
kind: ConfigMap
metadata:
  name: quickbite-config
  namespace: quickbite
data:
  ENVIRONMENT: "production"
  PORT: "8000"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  DATABASE_URL: "sqlite:////home/appuser/quickbite/data/quickbite.db"
  MAX_LOGIN_ATTEMPTS_PER_MIN: "5"

